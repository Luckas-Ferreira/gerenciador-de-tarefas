    <main class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-700 relative transition-colors duration-300">
        
        <button onclick="toggleTheme()" aria-label="Alternar tema claro e escuro" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 text-yellow-600 dark:text-yellow-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition flex items-center justify-center shadow-sm z-10">
            <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>

        <header class="bg-slate-50 dark:bg-slate-900 p-6 text-center border-b border-slate-200 dark:border-slate-700 transition-colors duration-300">
            <h1 class="text-2xl font-bold text-blue-700 dark:text-blue-400">Rastreador de Foco</h1>
            <p class="text-slate-600 dark:text-slate-400 text-sm mt-1">Gerencie suas tarefas e tempo</p>
        </header>

        <div class="p-4 bg-slate-50/50 dark:bg-slate-800/50 flex justify-between items-center border-b border-slate-200/50 dark:border-slate-700/50 transition-colors duration-300">
            <label for="targetMinutes" class="text-slate-600 dark:text-slate-400 text-sm font-semibold">Meta da tarefa (min):</label>
            <div class="flex items-center gap-2">
                <button onclick="adjustTimeInput(-1)" aria-label="Diminuir tempo" class="w-8 h-8 rounded bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-white font-bold transition">-</button>
                <input type="number" id="targetMinutes" value="10" min="1" max="120" aria-label="Minutos da meta"
                    class="w-16 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded p-1 text-center text-slate-900 dark:text-white font-bold focus:outline-none focus:border-blue-500 transition-colors">
                <button onclick="adjustTimeInput(1)" aria-label="Aumentar tempo" class="w-8 h-8 rounded bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-white font-bold transition">+</button>
            </div>
        </div>

        <div class="p-8 flex flex-col items-center relative">
            
            <div class="w-full bg-slate-200 dark:bg-slate-700 h-4 rounded-full mb-6 overflow-hidden relative transition-colors" 
                 role="progressbar" 
                 aria-label="Progresso do tempo decorrido"
                 aria-valuemin="0" 
                 aria-valuemax="100"
                 id="progressContainer">
                <div id="progressBar" class="progress-bar h-full bg-gradient-to-r from-blue-500 to-purple-500 w-0"></div>
            </div>

            <div class="text-7xl font-bold timer-display tracking-tight text-slate-900 dark:text-white mb-2 transition-colors" id="timerDisplay">
                00:00
            </div>
            
            <p id="statusText" class="text-slate-600 dark:text-slate-400 text-sm font-medium mb-6 transition-colors">
                Meta: <span id="targetDisplay">10:00</span>
            </p>

            <div class="flex gap-4 w-full justify-center">
                <button id="btnStart" onclick="toggleTimer()" class="btn-action flex-1 bg-green-700 hover:bg-green-600 text-white py-3 rounded-xl font-bold shadow-lg shadow-green-900/20 dark:shadow-none flex items-center justify-center gap-2 transition-colors">

                    <span id="btnStartText">Iniciar</span>
                </button>

                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>
        </div>

        <div class="bg-slate-50 dark:bg-slate-900 p-6 rounded-t-3xl border-t border-slate-200 dark:border-slate-700 mt-2 transition-colors">
            <div class="grid grid-cols-2 gap-6">
                
                <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 flex flex-col items-center transition-colors shadow-sm">
                    <span class="text-slate-600 dark:text-slate-400 text-xs uppercase tracking-wider font-bold mb-2">Tarefas Feitas</span>
                    <div class="flex items-center gap-3 mb-2">
                        <button onclick="manualAdjustTask(-1)" aria-label="Remover tarefa" class="text-slate-500 hover:text-red-600 dark:hover:text-red-400 transition p-1">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </button>
                        <span id="taskCount" class="text-4xl font-bold text-blue-700 dark:text-blue-400 transition-colors">0</span>
                        <button onclick="manualAdjustTask(1)" aria-label="Adicionar tarefa" class="text-slate-500 hover:text-green-600 dark:hover:text-green-400 transition p-1">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </button>
                    </div>
                </div>

                <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 flex flex-col items-center justify-center transition-colors shadow-sm">
                    <span class="text-slate-600 dark:text-slate-400 text-xs uppercase tracking-wider font-bold mb-2">Tempo Total</span>
                    <span id="totalTimeDisplay" class="text-2xl font-bold text-purple-700 dark:text-purple-400 transition-colors">0m</span>
                    <span class="text-xs text-slate-500 dark:text-slate-500 mt-1">acumulado</span>
                </div>
            </div>

            <div class="mt-6 text-center">
                <button onclick="clearAllData()" class="text-xs text-slate-500 hover:text-red-600 underline transition">
                    Limpar histórico e estatísticas
                </button>
            </div>
        </div>
    </main>

    <script>
        const ICON_PLAY = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
        const ICON_PAUSE = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';

        let intervalId = null, isRunning = false, timeElapsed = 0, totalDuration = 600, tasksCompleted = 0, totalSecondsFocused = 0;

        const timerDisplay = document.getElementById('timerDisplay');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer'); // Nova referência
        const btnStart = document.getElementById('btnStart');
        const iconContainer = document.getElementById('iconContainer');
        const btnStartText = document.getElementById('btnStartText');
        const statusText = document.getElementById('statusText');
        const targetDisplay = document.getElementById('targetDisplay');
        const taskCountDisplay = document.getElementById('taskCount');
        const totalTimeDisplay = document.getElementById('totalTimeDisplay');
        const inputMinutes = document.getElementById('targetMinutes');
        const htmlElement = document.documentElement;
        const defaultTitle = "Rastreador de Foco";

        function init() {
            loadData();
            updateTimerDisplay();
            updateTargetDisplay();
            inputMinutes.addEventListener('change', () => {
                saveData();
                updateTargetDisplay();
                if (!isRunning) resetTimer();
            });
        }

        function saveData() {
            const data = {
                tasks: tasksCompleted,
                totalTime: totalSecondsFocused,
                prefMinutes: inputMinutes.value,
                theme: htmlElement.classList.contains('dark') ? 'dark' : 'light'
            };
            localStorage.setItem('rws_tracker_data', JSON.stringify(data));
        }

        function loadData() {
            const saved = localStorage.getItem('rws_tracker_data');
            if (saved) {
                const data = JSON.parse(saved);
                tasksCompleted = data.tasks || 0;
                totalSecondsFocused = data.totalTime || 0;
                if (data.prefMinutes) inputMinutes.value = data.prefMinutes;
                if (data.theme === 'light') htmlElement.classList.remove('dark');
                else htmlElement.classList.add('dark');
            }
            const mins = parseInt(inputMinutes.value) || 10;
            totalDuration = mins * 60;
            updateStats();
        }

        function clearAllData() {
            if(confirm("Tem certeza? Isso vai zerar seu contador de tarefas e tempo acumulado.")) {
                tasksCompleted = 0;
                totalSecondsFocused = 0;
                saveData();
                updateStats();
                resetTimer();
            }
        }

        function toggleTheme() {
            htmlElement.classList.toggle('dark');
            saveData();
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function formatTotalTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            if (h > 0) return `${h}h ${m}m`;
            return `${m}m`;
        }

        function updateTargetDisplay() {
            const mins = parseInt(inputMinutes.value) || 10;
            totalDuration = mins * 60;
            targetDisplay.textContent = formatTime(totalDuration);
        }

        function updateTimerDisplay() {
            const formatted = formatTime(timeElapsed);
            timerDisplay.textContent = formatted;
            
            if (isRunning) document.title = `${formatted} - Foco`;
            else if (timeElapsed > 0) document.title = `Pausado (${formatted})`;
            else document.title = defaultTitle;

            let progressPercent = (timeElapsed / totalDuration) * 100;
            if (progressPercent > 100) progressPercent = 100;
            
            progressBar.style.width = `${progressPercent}%`;
            // ARIA FIX: Atualiza atributo no container pai
            progressContainer.setAttribute('aria-valuenow', Math.round(progressPercent));
        }

        function toggleTimer() {
            if (isRunning) pauseTimer();
            else startTimer();
        }

        function startTimer() {
            const mins = parseInt(inputMinutes.value) || 10;
            totalDuration = mins * 60;

            isRunning = true;
            btnStart.classList.remove('bg-green-700', 'hover:bg-green-600');
            btnStart.classList.add('bg-yellow-600', 'hover:bg-yellow-500'); // Contraste melhorado
            iconContainer.innerHTML = ICON_PAUSE;
            btnStartText.textContent = "Pausar";
            
            statusText.innerHTML = `Meta: <span class="font-bold">${formatTime(totalDuration)}</span>`;
            // Contraste melhorado
            statusText.className = "text-blue-700 dark:text-blue-400 text-sm font-medium mb-6"; 

            intervalId = setInterval(() => {
                timeElapsed++;
                updateTimerDisplay();
                if (timeElapsed >= totalDuration) finishTask();
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(intervalId);
            updateTimerDisplay();
            btnStart.classList.remove('bg-yellow-600', 'hover:bg-yellow-500');
            btnStart.classList.add('bg-green-700', 'hover:bg-green-600'); // Contraste melhorado
            iconContainer.innerHTML = ICON_PLAY;
            btnStartText.textContent = "Continuar";
        }

        function resetTimer() {
            pauseTimer();
            timeElapsed = 0;
            const mins = parseInt(inputMinutes.value) || 10;
            totalDuration = mins * 60;
            updateTimerDisplay();
            updateTargetDisplay();
            
            iconContainer.innerHTML = ICON_PLAY;
            btnStartText.textContent = "Iniciar";
            statusText.innerHTML = `Meta: <span>${formatTime(totalDuration)}</span>`;
            statusText.className = "text-slate-600 dark:text-slate-400 text-sm font-medium mb-6"; // Contraste fix
            progressBar.style.width = '0%';
            progressContainer.setAttribute('aria-valuenow', '0');
            document.title = defaultTitle;
        }

        function finishTask() {
            playAlarm();
            pauseTimer();
            tasksCompleted++;
            const mins = parseInt(inputMinutes.value) || 10;
            totalSecondsFocused += (mins * 60);
            updateStats();
            saveData();
            
            statusText.textContent = "Tarefa Concluída!";
            statusText.className = "text-green-700 dark:text-green-400 text-sm font-bold mb-6"; // Contraste fix
            document.title = "Concluído! ✅";
            
            setTimeout(() => { resetTimer(); }, 3000);
        }

        function manualAdjustTask(amount) {
            const mins = parseInt(inputMinutes.value) || 10;
            if (amount > 0) {
                tasksCompleted++;
                totalSecondsFocused += (mins * 60);
            } else {
                if (tasksCompleted > 0) {
                    tasksCompleted--;
                    totalSecondsFocused -= (mins * 60);
                    if (totalSecondsFocused < 0) totalSecondsFocused = 0;
                }
            }
            updateStats();
            saveData();
        }

        function updateStats() {
            taskCountDisplay.textContent = tasksCompleted;
            totalTimeDisplay.textContent = formatTotalTime(totalSecondsFocused);
        }

        function adjustTimeInput(val) {
            let current = parseInt(inputMinutes.value) || 10;
            current += val;
            if (current < 1) current = 1;
            inputMinutes.value = current;
            saveData();
            updateTargetDisplay();
            if (!isRunning) resetTimer();
        }

        function playAlarm() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            const now = ctx.currentTime;
            const gainNode = ctx.createGain();
            gainNode.connect(ctx.destination);
            gainNode.gain.setValueAtTime(0.3, now);

            const playNote = (freq, time, duration) => {
                const osc = ctx.createOscillator();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, time);
                osc.connect(gainNode);
                osc.start(time);
                osc.stop(time + duration);
            };

            const notes = [523.25, 659.25, 783.99, 1046.50];
            const spacing = 0.15;

            playNote(notes[0], now, spacing);
            playNote(notes[1], now + spacing, spacing);
            playNote(notes[2], now + spacing * 2, spacing);
            playNote(notes[3], now + spacing * 3, spacing * 3);

            const secondPass = now + 0.8;
            playNote(notes[0], secondPass, spacing);
            playNote(notes[1], secondPass + spacing, spacing);
            playNote(notes[2], secondPass + spacing * 2, spacing);
            playNote(notes[3], secondPass + spacing * 3, 1.5);

            gainNode.gain.setValueAtTime(0.3, secondPass + 0.5);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, secondPass + 2.0);
        }

        init();
    </script>
</body>
</html>
