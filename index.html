<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon (Ícone na aba) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏱️</text></svg>">
    
    <title>Rastreador de Foco</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Configuração do Tailwind para Modo Escuro Manual -->
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        .card-transition {
            transition: background-color 0.3s, border-color 0.3s;
        }

        .timer-display {
            font-variant-numeric: tabular-nums;
        }

        .progress-bar {
            transition: width 1s linear;
        }

        .btn-action {
            transition: all 0.2s;
        }
        .btn-action:active {
            transform: scale(0.95);
        }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-e2e8f0 transition-colors duration-300">

    <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-700 card-transition relative">
        
        <!-- Botão de Tema -->
        <button onclick="toggleTheme()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 text-yellow-500 dark:text-yellow-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition flex items-center justify-center shadow-sm z-10">
            <i class="fa-solid fa-sun dark:hidden"></i>
            <i class="fa-solid fa-moon hidden dark:block"></i>
        </button>

        <!-- Header -->
        <div class="bg-slate-50 dark:bg-slate-900 p-6 text-center border-b border-slate-200 dark:border-slate-700 transition-colors duration-300">
            <h1 class="text-2xl font-bold text-blue-600 dark:text-blue-400">Rastreador de Foco</h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Gerencie suas tarefas e tempo</p>
        </div>

        <!-- Configuração de Tempo (Meta) -->
        <div class="p-4 bg-slate-50/50 dark:bg-slate-800/50 flex justify-between items-center border-b border-slate-200/50 dark:border-slate-700/50 transition-colors duration-300">
            <label class="text-slate-500 dark:text-slate-400 text-sm font-semibold">Meta da tarefa (min):</label>
            <div class="flex items-center gap-2">
                <button onclick="adjustTimeInput(-1)" class="w-8 h-8 rounded bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-white font-bold transition">-</button>
                <input type="number" id="targetMinutes" value="10" min="1" max="120" 
                    class="w-16 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded p-1 text-center text-slate-800 dark:text-white font-bold focus:outline-none focus:border-blue-500 transition-colors">
                <button onclick="adjustTimeInput(1)" class="w-8 h-8 rounded bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-white font-bold transition">+</button>
            </div>
        </div>

        <!-- Área Principal do Cronômetro -->
        <div class="p-8 flex flex-col items-center relative">
            <!-- Barra de Progresso Visual -->
            <div class="w-full bg-slate-200 dark:bg-slate-700 h-4 rounded-full mb-6 overflow-hidden relative transition-colors">
                <div id="progressBar" class="progress-bar h-full bg-gradient-to-r from-blue-500 to-purple-500 w-0"></div>
            </div>

            <!-- Display do Tempo (Agora conta subindo) -->
            <div class="text-7xl font-bold timer-display tracking-tight text-slate-800 dark:text-white mb-2 transition-colors" id="timerDisplay">
                00:00
            </div>
            
            <!-- Texto auxiliar mostrando a meta -->
            <p id="statusText" class="text-slate-500 dark:text-slate-400 text-sm font-medium mb-6 transition-colors">
                Meta: <span id="targetDisplay">10:00</span>
            </p>

            <!-- Controles do Cronômetro -->
            <div class="flex gap-4 w-full justify-center">
                <button id="btnStart" onclick="toggleTimer()" class="btn-action flex-1 bg-green-600 hover:bg-green-500 text-white py-3 rounded-xl font-bold shadow-lg shadow-green-900/20 dark:shadow-none flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play"></i> <span id="btnStartText">Iniciar</span>
                </button>
                
                <button onclick="resetTimer()" class="btn-action w-14 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-200 rounded-xl font-bold flex items-center justify-center transition-colors" title="Resetar Cronômetro">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            </div>
        </div>

        <!-- Estatísticas e Ajustes -->
        <div class="bg-slate-50 dark:bg-slate-900 p-6 rounded-t-3xl border-t border-slate-200 dark:border-slate-700 mt-2 transition-colors">
            <div class="grid grid-cols-2 gap-6">
                
                <!-- Contador de Tarefas -->
                <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 flex flex-col items-center transition-colors shadow-sm">
                    <span class="text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider font-bold mb-2">Tarefas Feitas</span>
                    <div class="flex items-center gap-3 mb-2">
                        <button onclick="manualAdjustTask(-1)" class="text-slate-400 hover:text-red-500 dark:hover:text-red-400 transition p-1">
                            <i class="fa-solid fa-minus-circle text-xl"></i>
                        </button>
                        <span id="taskCount" class="text-4xl font-bold text-blue-600 dark:text-blue-400 transition-colors">0</span>
                        <button onclick="manualAdjustTask(1)" class="text-slate-400 hover:text-green-500 dark:hover:text-green-400 transition p-1">
                            <i class="fa-solid fa-plus-circle text-xl"></i>
                        </button>
                    </div>
                </div>

                <!-- Tempo Total -->
                <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 flex flex-col items-center justify-center transition-colors shadow-sm">
                    <span class="text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider font-bold mb-2">Tempo Total</span>
                    <span id="totalTimeDisplay" class="text-2xl font-bold text-purple-600 dark:text-purple-400 transition-colors">0m</span>
                    <span class="text-xs text-slate-400 dark:text-slate-500 mt-1">acumulado</span>
                </div>
            </div>

            <div class="mt-6 text-center">
                <button onclick="clearAllData()" class="text-xs text-slate-400 hover:text-red-500 underline transition">
                    Limpar histórico e estatísticas
                </button>
            </div>
        </div>
    </div>

    <!-- Lógica -->
    <script>
        // --- Variáveis de Estado ---
        let intervalId = null;
        let isRunning = false;
        
        let timeElapsed = 0; 
        let totalDuration = 600; 
        
        let tasksCompleted = 0;
        let totalSecondsFocused = 0;

        // Elementos do DOM
        const timerDisplay = document.getElementById('timerDisplay');
        const progressBar = document.getElementById('progressBar');
        const btnStart = document.getElementById('btnStart');
        const statusText = document.getElementById('statusText');
        const targetDisplay = document.getElementById('targetDisplay');
        const taskCountDisplay = document.getElementById('taskCount');
        const totalTimeDisplay = document.getElementById('totalTimeDisplay');
        const inputMinutes = document.getElementById('targetMinutes');
        const htmlElement = document.documentElement;

        const defaultTitle = "Rastreador de Foco";

        // --- Inicialização ---
        
        function init() {
            loadData();
            updateTimerDisplay(); // Mostra 00:00
            updateTargetDisplay(); // Mostra a meta
            
            inputMinutes.addEventListener('change', () => {
                saveData();
                updateTargetDisplay();
                if (!isRunning) resetTimer();
            });
        }

        function saveData() {
            const data = {
                tasks: tasksCompleted,
                totalTime: totalSecondsFocused,
                prefMinutes: inputMinutes.value,
                theme: htmlElement.classList.contains('dark') ? 'dark' : 'light'
            };
            localStorage.setItem('rws_tracker_data', JSON.stringify(data));
        }

        function loadData() {
            const saved = localStorage.getItem('rws_tracker_data');
            if (saved) {
                const data = JSON.parse(saved);
                tasksCompleted = data.tasks || 0;
                totalSecondsFocused = data.totalTime || 0;
                
                if (data.prefMinutes) {
                    inputMinutes.value = data.prefMinutes;
                }
                
                if (data.theme === 'light') {
                    htmlElement.classList.remove('dark');
                } else {
                    htmlElement.classList.add('dark');
                }
            }
            const mins = parseInt(inputMinutes.value) || 10;
            totalDuration = mins * 60;
            updateStats();
        }

        function clearAllData() {
            if(confirm("Tem certeza? Isso vai zerar seu contador de tarefas e tempo acumulado.")) {
                tasksCompleted = 0;
                totalSecondsFocused = 0;
                saveData();
                updateStats();
                resetTimer();
            }
        }

        function toggleTheme() {
            htmlElement.classList.toggle('dark');
            saveData();
        }

        // --- Funções do Cronômetro ---

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function formatTotalTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            if (h > 0) return `${h}h ${m}m`;
            return `${m}m`;
        }

        function updateTargetDisplay() {
            const mins = parseInt(inputMinutes.value) || 10;
            totalDuration = mins * 60;
            targetDisplay.textContent = formatTime(totalDuration);
        }

        function updateTimerDisplay() {
            const formatted = formatTime(timeElapsed);
            timerDisplay.textContent = formatted;
            
            if (isRunning) {
                document.title = `${formatted} - Foco`;
            } else if (timeElapsed > 0) {
                document.title = `Pausado (${formatted})`;
            } else {
                document.title = defaultTitle;
            }

            let progressPercent = (timeElapsed / totalDuration) * 100;
            if (progressPercent > 100) progressPercent = 100;
            progressBar.style.width = `${progressPercent}%`;
        }

        function toggleTimer() {
            if (isRunning) pauseTimer();
            else startTimer();
        }

        function startTimer() {
            const mins = parseInt(inputMinutes.value) || 10;
            totalDuration = mins * 60;

            isRunning = true;
            btnStart.classList.remove('bg-green-600', 'hover:bg-green-500');
            btnStart.classList.add('bg-yellow-500', 'hover:bg-yellow-400');
            btnStart.innerHTML = '<i class="fa-solid fa-pause"></i> <span>Pausar</span>';
            
            statusText.innerHTML = `Meta: <span class="font-bold">${formatTime(totalDuration)}</span>`;
            statusText.className = "text-blue-600 dark:text-blue-400 text-sm font-medium mb-6";

            intervalId = setInterval(() => {
                timeElapsed++;
                updateTimerDisplay();

                if (timeElapsed >= totalDuration) {
                    finishTask();
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(intervalId);
            updateTimerDisplay();
            btnStart.classList.remove('bg-yellow-500', 'hover:bg-yellow-400');
            btnStart.classList.add('bg-green-600', 'hover:bg-green-500');
            btnStart.innerHTML = '<i class="fa-solid fa-play"></i> <span>Continuar</span>';
        }

        function resetTimer() {
            pauseTimer();
            timeElapsed = 0;
            
            const mins = parseInt(inputMinutes.value) || 10;
            totalDuration = mins * 60;
            
            updateTimerDisplay();
            updateTargetDisplay();
            
            btnStart.innerHTML = '<i class="fa-solid fa-play"></i> <span>Iniciar</span>';
            statusText.innerHTML = `Meta: <span>${formatTime(totalDuration)}</span>`;
            statusText.className = "text-slate-500 dark:text-slate-400 text-sm font-medium mb-6";
            progressBar.style.width = '0%';
            document.title = defaultTitle;
        }

        function finishTask() {
            playAlarm();
            pauseTimer();
            
            tasksCompleted++;
            const mins = parseInt(inputMinutes.value) || 10;
            totalSecondsFocused += (mins * 60);

            updateStats();
            saveData();
            
            statusText.textContent = "Tarefa Concluída!";
            statusText.className = "text-green-600 dark:text-green-400 text-sm font-bold mb-6";
            document.title = "Concluído! ✅";
            
            setTimeout(() => {
                resetTimer();
            }, 3000); // Espera 3 segundos agora (pois o som é mais longo)
        }

        function manualAdjustTask(amount) {
            const mins = parseInt(inputMinutes.value) || 10;
            
            if (amount > 0) {
                tasksCompleted++;
                totalSecondsFocused += (mins * 60);
            } else {
                if (tasksCompleted > 0) {
                    tasksCompleted--;
                    totalSecondsFocused -= (mins * 60);
                    if (totalSecondsFocused < 0) totalSecondsFocused = 0;
                }
            }
            updateStats();
            saveData();
        }

        function updateStats() {
            taskCountDisplay.textContent = tasksCompleted;
            totalTimeDisplay.textContent = formatTotalTime(totalSecondsFocused);
        }

        function adjustTimeInput(val) {
            let current = parseInt(inputMinutes.value) || 10;
            current += val;
            if (current < 1) current = 1;
            inputMinutes.value = current;
            
            saveData();
            updateTargetDisplay();
            
            if (!isRunning) resetTimer();
        }

        // Função de Alarme Melhorada (Mais alto e longo)
        function playAlarm() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            
            const now = ctx.currentTime;
            const gainNode = ctx.createGain();
            gainNode.connect(ctx.destination);
            gainNode.gain.setValueAtTime(0.3, now); // Volume mais alto (0.3 é seguro e audível)

            // Função auxiliar para tocar nota
            const playNote = (freq, time, duration) => {
                const osc = ctx.createOscillator();
                osc.type = 'triangle'; // Som mais perceptível que 'sine'
                osc.frequency.setValueAtTime(freq, time);
                osc.connect(gainNode);
                osc.start(time);
                osc.stop(time + duration);
            };

            // Melodia de Vitória (Dó Maior Arpejo Duplo)
            // C5, E5, G5, C6 - Repete 2x
            const notes = [523.25, 659.25, 783.99, 1046.50];
            const spacing = 0.15; // Velocidade entre notas

            // Primeira passada
            playNote(notes[0], now, spacing);
            playNote(notes[1], now + spacing, spacing);
            playNote(notes[2], now + spacing * 2, spacing);
            playNote(notes[3], now + spacing * 3, spacing * 3); // Nota longa

            // Segunda passada (depois de 1 segundo)
            const secondPass = now + 0.8;
            playNote(notes[0], secondPass, spacing);
            playNote(notes[1], secondPass + spacing, spacing);
            playNote(notes[2], secondPass + spacing * 2, spacing);
            playNote(notes[3], secondPass + spacing * 3, 1.5); // Nota final bem longa

            // Fade out no final geral
            gainNode.gain.setValueAtTime(0.3, secondPass + 0.5);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, secondPass + 2.0);
        }

        init();

    </script>
</body>
</html>
