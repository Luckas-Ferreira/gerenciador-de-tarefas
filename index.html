        /* ── Base transitions ─────────────────────── */
        body { transition: background-color 0.3s, color 0.3s; }
        .timer-display { font-variant-numeric: tabular-nums; }
        .progress-bar { transition: width 1s linear; }
        .btn-action:active { transform: scale(0.95); }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        /* ── Modal ───────────────────────────────── */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: rgba(2, 6, 23, 0.72);
            backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal-card {
            background: #ffffff;
            border-radius: 1.5rem;
            padding: 1.75rem;
            width: 100%; max-width: 380px; margin: 1rem;
            transform: scale(0.94) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.25s ease;
            opacity: 0;
            box-shadow: 0 32px 72px rgba(0,0,0,0.3);
        }
        .dark .modal-card { background: #1e293b; }
        .modal-overlay.open .modal-card { transform: scale(1) translateY(0); opacity: 1; }

        /* ── Auth tabs ───────────────────────────── */
        .auth-tab {
            flex: 1; padding: 0.45rem 0.5rem;
            border-radius: 0.5rem;
            font-size: 0.875rem; font-weight: 600;
            transition: background 0.2s, color 0.2s;
            color: #64748b; cursor: pointer; border: none;
            background: transparent;
        }
        .auth-tab.active { background: #2563eb; color: #fff; }
        .dark .auth-tab:not(.active) { color: #94a3b8; }

        /* ── Modal dark mode extras ──────────────── */
        .modal-tab-bar {
            display: flex; gap: 4px; padding: 4px;
            background: #f1f5f9; border-radius: 12px; margin-bottom: 1.25rem;
            transition: background 0.2s;
        }
        .dark .modal-tab-bar { background: #0f172a; }

        .modal-label {
            display: block; font-size: 0.75rem; font-weight: 600;
            color: #64748b; text-transform: uppercase;
            letter-spacing: 0.05em; margin-bottom: 4px;
        }
        .dark .modal-label { color: #64748b; }

        .modal-divider-line { flex: 1; height: 1px; background: #e2e8f0; }
        .dark .modal-divider-line { background: #334155; }

        .modal-google-btn {
            width: 100%; margin-top: 10px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 10px; border: 1.5px solid #e2e8f0; border-radius: 12px;
            background: #ffffff; cursor: pointer;
            font-size: 0.9375rem; font-weight: 600; color: #1e293b;
            transition: background 0.2s, border-color 0.2s;
        }
        .modal-google-btn:hover { background: #f8fafc; border-color: #cbd5e1; }
        .dark .modal-google-btn { background: #0f172a; border-color: #334155; color: #e2e8f0; }
        .dark .modal-google-btn:hover { background: #1e3a5f20; border-color: #475569; }

        .modal-close-btn {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 9999px; border: none; background: transparent;
            cursor: pointer; color: #94a3b8; transition: background 0.2s, color 0.2s;
        }
        .modal-close-btn:hover { background: #f1f5f9; color: #475569; }
        .dark .modal-close-btn:hover { background: #334155; color: #e2e8f0; }

        .modal-skip-btn {
            font-size: 0.75rem; color: #94a3b8;
            background: none; border: none; cursor: pointer;
            transition: color 0.2s;
        }
        .modal-skip-btn:hover { color: #64748b; }
        .dark .modal-skip-btn:hover { color: #cbd5e1; }

        /* ── Currency toggle ─────────────────────── */
        .currency-selector {
            display: flex; gap: 4px; padding: 3px;
            background: #f1f5f9; border-radius: 10px;
        }
        .dark .currency-selector { background: #0f172a; }
        .currency-btn {
            padding: 4px 10px; border-radius: 7px; border: none;
            font-size: 0.8125rem; font-weight: 700; cursor: pointer;
            background: transparent; color: #64748b;
            transition: background 0.18s, color 0.18s;
        }
        .currency-btn.active { background: #2563eb; color: #fff; }
        .dark .currency-btn:not(.active) { color: #94a3b8; }
        .dark .currency-btn.active { background: #2563eb; color: #fff; }

        /* ── Input styled ────────────────────────── */
        .input-styled {
            width: 100%;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 0.625rem;
            padding: 0.6rem 0.875rem;
            font-size: 0.9375rem; color: #0f172a;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        .dark .input-styled { background: #0f172a; border-color: #334155; color: #f1f5f9; }
        .input-styled:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }

        /* ── Toast ───────────────────────────────── */
        #toast {
            position: fixed; bottom: 1.5rem; left: 50%;
            transform: translateX(-50%) translateY(80px);
            z-index: 200; padding: 0.6rem 1.25rem;
            border-radius: 9999px;
            font-size: 0.8125rem; font-weight: 600;
            transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
            pointer-events: none; white-space: nowrap;
            background: #1e293b; color: #f1f5f9;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
        #toast.success { background: #14532d; color: #bbf7d0; }
        #toast.error   { background: #7f1d1d; color: #fecaca; }
        #toast.info    { background: #1e3a5f; color: #bfdbfe; }

        /* ── Spinner ─────────────────────────────── */
        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── User avatar ─────────────────────────── */
        .user-avatar {
            width: 26px; height: 26px; border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.6875rem; font-weight: 700; color: #fff;
            flex-shrink: 0;
        }

        /* ── Earnings slide-in ───────────────────── */
        #earningsSection {
            max-height: 0; overflow: hidden;
            transition: max-height 0.5s ease, opacity 0.4s ease;
            opacity: 0;
        }
        #earningsSection.show { max-height: 400px; opacity: 1; }

        /* ── Earnings gradient card ──────────────── */
        .earnings-card {
            background: linear-gradient(135deg, #1d4ed8 0%, #7c3aed 100%);
            border-radius: 0.875rem; padding: 1rem 1.125rem;
            color: #fff;
        }

        /* ── Auth btn ────────────────────────────── */
        .auth-login-btn {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 0.75rem; font-weight: 600;
            color: #2563eb;
            border: 1.5px solid #bfdbfe;
            border-radius: 9999px;
            padding: 5px 12px;
            transition: background 0.2s, color 0.2s;
            background: transparent; cursor: pointer;
        }
        .auth-login-btn:hover { background: #eff6ff; }
        .dark .auth-login-btn { color: #60a5fa; border-color: #1e3a5f; }
        .dark .auth-login-btn:hover { background: #1e3a5f30; }

        /* ── Cloud synced badge ──────────────────── */
        .cloud-badge {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 0.6875rem; font-weight: 600;
            color: #16a34a; background: #dcfce7;
            border-radius: 9999px; padding: 2px 8px;
        }
        .dark .cloud-badge { color: #4ade80; background: #14532d40; }
    </style>
</head>

    // ════════════════════════════════════════════════════════════════
    const ICON_PLAY  = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
    const ICON_PAUSE = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';

    // ════════════════════════════════════════════════════════════════
    // STATE
    // ════════════════════════════════════════════════════════════════
    let intervalId   = null;
    let isRunning    = false;
    let timeElapsed  = 0;
    let startTime    = null;
    let totalDuration = 600;
    let historyData  = {};
    let chartInstance = null;
    let currentUser  = null;
    let hourlyRate   = 0;
    let selectedCurrency = 'BRL'; // 'BRL' | 'USD' | 'EUR'
    let isSaving     = false; // debounce cloud saves

    // DOM refs
    const timerDisplay      = document.getElementById('timerDisplay');
    const progressBar       = document.getElementById('progressBar');
    const progressContainer = document.getElementById('progressContainer');
    const btnStart          = document.getElementById('btnStart');
    const iconContainer     = document.getElementById('iconContainer');
    const btnStartText      = document.getElementById('btnStartText');
    const statusText        = document.getElementById('statusText');
    const targetDisplay     = document.getElementById('targetDisplay');
    const taskCountDisplay  = document.getElementById('taskCount');
    const totalTimeDisplay  = document.getElementById('totalTimeDisplay');
    const inputMinutes      = document.getElementById('targetMinutes');
    const htmlElement       = document.documentElement;
    const hourlyRateInput   = document.getElementById('hourlyRateInput');
    const defaultTitle      = "Gerenciador de Tarefas";

    // ════════════════════════════════════════════════════════════════
    // INIT
    // ════════════════════════════════════════════════════════════════
    function init() {
        loadLocalData();
        updateTimerDisplay();
        updateTargetDisplay();

        inputMinutes.addEventListener('change', () => {
            saveData();
            updateTargetDisplay();
            if (!isRunning) resetTimer();
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && isRunning) updateTimerFromTimestamp();
        });

        // Close modal when clicking backdrop
        document.getElementById('loginModal').addEventListener('click', function(e) {
            if (e.target === this) hideLoginModal();
        });

        // Firebase auth listener
        if (FIREBASE_READY && auth) {
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    currentUser = user;
                    await onUserLoggedIn(user);
                } else {
                    currentUser = null;
                    onUserLoggedOut();
                }
            });
        }
    }

    // ════════════════════════════════════════════════════════════════
    // MODAL
    // ════════════════════════════════════════════════════════════════
    function showLoginModal() {
        if (!FIREBASE_READY) {
            showToast('Configure o Firebase primeiro — veja o guia!', 'error');
            return;
        }
        document.getElementById('loginModal').classList.add('open');
        setTimeout(() => document.getElementById('loginEmail').focus(), 300);
    }

    function hideLoginModal() {
        document.getElementById('loginModal').classList.remove('open');
        clearAuthErrors();
    }

    function switchTab(tab) {
        const loginForm    = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const tabLogin     = document.getElementById('tabLogin');
        const tabRegister  = document.getElementById('tabRegister');
        clearAuthErrors();
        if (tab === 'login') {
            loginForm.style.display    = 'flex';
            registerForm.style.display = 'none';
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
        } else {
            loginForm.style.display    = 'none';
            registerForm.style.display = 'flex';
            tabLogin.classList.remove('active');
            tabRegister.classList.add('active');
        }
    }

    function clearAuthErrors() {
        ['loginError','registerError'].forEach(id => {
            const el = document.getElementById(id);
            el.classList.add('hidden');
            el.textContent = '';
        });
    }

    function setButtonLoading(btn, loading, originalText) {
        btn.disabled = loading;
        btn.innerHTML = loading ? '<span class="spinner"></span>' : originalText;
    }

    // ════════════════════════════════════════════════════════════════
    // AUTH HANDLERS
    // ════════════════════════════════════════════════════════════════
    async function handleLogin(event) {
        event.preventDefault();
        const email    = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const btn      = document.getElementById('btnLogin');
        const errorEl  = document.getElementById('loginError');

        setButtonLoading(btn, true, 'Entrar');
        try {
            await auth.signInWithEmailAndPassword(email, password);
            hideLoginModal();
            showToast('Bem-vindo de volta! ✓', 'success');
        } catch(e) {
            errorEl.textContent = translateAuthError(e.code);
            errorEl.classList.remove('hidden');
            setButtonLoading(btn, false, 'Entrar');
        }
    }

    async function handleRegister(event) {
        event.preventDefault();
        const name     = document.getElementById('registerName').value.trim();
        const email    = document.getElementById('registerEmail').value.trim();
        const password = document.getElementById('registerPassword').value;
        const btn      = document.getElementById('btnRegister');
        const errorEl  = document.getElementById('registerError');

        setButtonLoading(btn, true, 'Criar conta');
        try {
            const cred = await auth.createUserWithEmailAndPassword(email, password);
            await cred.user.updateProfile({ displayName: name });

            // Salvar perfil inicial no Firestore
            await db.collection('users').doc(cred.user.uid).set({
                profile: { name, email, hourlyRate: 0 },
                history: {}
            });

            hideLoginModal();
            showToast('Conta criada! Bem-vindo, ' + name + '! 🎉', 'success');

            // Oferecer importar dados locais
            if (hasSignificantLocalData()) {
                setTimeout(() => {
                    if (confirm('Você tem dados salvos localmente (histórico de tarefas). Deseja importá-los para sua nova conta na nuvem?')) {
                        importLocalDataToCloud(cred.user.uid);
                    }
                }, 600);
            }
        } catch(e) {
            errorEl.textContent = translateAuthError(e.code);
            errorEl.classList.remove('hidden');
            setButtonLoading(btn, false, 'Criar conta');
        }
    }

    async function handleGoogleLogin() {
        if (!FIREBASE_READY) { showToast('Configure o Firebase primeiro — veja o guia!', 'error'); return; }
        const btn = document.getElementById('btnGoogle');
        const origHTML = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner" style="border-color:rgba(0,0,0,0.2);border-top-color:#1e293b;"></span>';
        try {
            const provider = new firebase.auth.GoogleAuthProvider();
            const cred = await auth.signInWithPopup(provider);
            const user = cred.user;
            // Criar perfil no Firestore se for a primeira vez
            const docRef = db.collection('users').doc(user.uid);
            const snap   = await docRef.get();
            if (!snap.exists) {
                await docRef.set({
                    profile: { name: user.displayName || '', email: user.email, hourlyRate: 0 },
                    history: {}
                });
                // Oferecer importar dados locais
                if (hasSignificantLocalData()) {
                    setTimeout(() => {
                        if (confirm('Você tem dados salvos localmente. Deseja importá-los para sua conta?')) {
                            importLocalDataToCloud(user.uid);
                        }
                    }, 600);
                }
            }
            hideLoginModal();
            showToast('Bem-vindo, ' + (user.displayName || user.email) + '! ✓', 'success');
        } catch(e) {
            if (e.code !== 'auth/popup-closed-by-user') {
                showToast(translateAuthError(e.code), 'error');
            }
            btn.disabled = false;
            btn.innerHTML = origHTML;
        }
    }

    async function handleLogout() {
        if (!FIREBASE_READY || !auth) return;
        try {
            await auth.signOut();
            showToast('Você saiu da sua conta', 'info');
        } catch(e) {
            showToast('Erro ao sair', 'error');
        }
    }

    function translateAuthError(code) {
        const map = {
            'auth/user-not-found':        'Nenhuma conta encontrada com este e-mail.',
            'auth/wrong-password':        'Senha incorreta.',
            'auth/invalid-credential':    'E-mail ou senha incorretos.',
            'auth/email-already-in-use':  'Este e-mail já está cadastrado.',
            'auth/weak-password':         'A senha deve ter pelo menos 6 caracteres.',
            'auth/invalid-email':         'Formato de e-mail inválido.',
            'auth/too-many-requests':     'Muitas tentativas. Aguarde e tente novamente.',
            'auth/network-request-failed':'Sem conexão com a internet.',
        };
        return map[code] || 'Ocorreu um erro. Tente novamente.';
    }

    // ════════════════════════════════════════════════════════════════
    // AUTH STATE CALLBACKS
    // ════════════════════════════════════════════════════════════════
    async function onUserLoggedIn(user) {
        // Show user bar, hide login btn
        document.getElementById('btnOpenLogin').style.display = 'none';
        const bar = document.getElementById('userInfoBar');
        bar.style.display = 'flex';

        const displayName = user.displayName || user.email.split('@')[0];
        document.getElementById('userNameDisplay').textContent = displayName;
        document.getElementById('userAvatar').textContent = displayName.charAt(0).toUpperCase();
        // Dark mode fix for name
        document.getElementById('userNameDisplay').style.color =
            htmlElement.classList.contains('dark') ? '#e2e8f0' : '#334155';

        // Show earnings section
        document.getElementById('earningsSection').classList.add('show');

        // Load cloud data
        await loadCloudData(user.uid);
    }

    function onUserLoggedOut() {
        document.getElementById('btnOpenLogin').style.display = 'inline-flex';
        const bar = document.getElementById('userInfoBar');
        bar.style.display = 'none';

        document.getElementById('earningsSection').classList.remove('show');

        // Reload from localStorage
        loadLocalData();
    }

    // ════════════════════════════════════════════════════════════════
    // FIRESTORE
    // ════════════════════════════════════════════════════════════════
    async function loadCloudData(uid) {
        try {
            const snap = await db.collection('users').doc(uid).get();
            if (snap.exists) {
                const data = snap.data();
                if (data.history) historyData = data.history;
                if (data.profile) {
                    hourlyRate = data.profile.hourlyRate || 0;
                    hourlyRateInput.value = hourlyRate;
                    if (data.profile.currency) {
                        selectedCurrency = data.profile.currency;
                        applyCurrencyUI(selectedCurrency);
                    }
                }
            }
            // Device-specific prefs from localStorage
            const localRaw = localStorage.getItem('rws_tracker_data');
            if (localRaw) {
                const local = JSON.parse(localRaw);
                if (local.theme === 'light') htmlElement.classList.remove('dark');
                else htmlElement.classList.add('dark');
                if (local.prefMinutes) inputMinutes.value = local.prefMinutes;
            }
            const mins = parseInt(inputMinutes.value) || 10;
            totalDuration = mins * 60;
            updateStats();
            updateEarningsDisplay();
            if (chartInstance) updateChart();
            else initChart();
        } catch(e) {
            console.error('Erro ao carregar nuvem:', e);
            showToast('Erro ao carregar dados da nuvem', 'error');
        }
    }

    async function saveCloudData() {
        if (!currentUser || !FIREBASE_READY || !db) return;
        if (isSaving) return;
        isSaving = true;
        try {
            await db.collection('users').doc(currentUser.uid).set({
                profile: {
                    name:       currentUser.displayName || '',
                    email:      currentUser.email,
                    hourlyRate,
                    currency:   selectedCurrency
                },
                history: historyData
            }, { merge: true });
        } catch(e) {
            console.error('Erro ao salvar nuvem:', e);
        } finally {
            isSaving = false;
        }
    }

    function hasSignificantLocalData() {
        try {
            const raw = localStorage.getItem('rws_tracker_data');
            if (!raw) return false;
            const d = JSON.parse(raw);
            if (!d.history) return false;
            return Object.values(d.history).some(x => x.tasks > 0 || x.totalTime > 0);
        } catch { return false; }
    }

    async function importLocalDataToCloud(uid) {
        try {
            const raw = localStorage.getItem('rws_tracker_data');
            if (!raw) return;
            const local = JSON.parse(raw);
            if (!local.history) return;

            const snap = await db.collection('users').doc(uid).get();
            const cloudHistory = (snap.exists && snap.data().history) ? snap.data().history : {};

            // Merge: cloud data wins on same date, local fills gaps
            const merged = { ...local.history, ...cloudHistory };
            await db.collection('users').doc(uid).set({ history: merged }, { merge: true });

            historyData = merged;
            updateStats();
            updateChart();
            showToast('Dados locais importados com sucesso! ✓', 'success');
        } catch(e) {
            console.error('Erro ao importar:', e);
            showToast('Erro ao importar dados locais', 'error');
        }
    }

    // ════════════════════════════════════════════════════════════════
    // HOURLY RATE, CURRENCY & EARNINGS
    // ════════════════════════════════════════════════════════════════
    const CURRENCY_CONFIG = {
        BRL: { locale: 'pt-BR', code: 'BRL', symbol: 'R$'  },
        USD: { locale: 'en-US', code: 'USD', symbol: 'US$' },
        EUR: { locale: 'de-DE', code: 'EUR', symbol: '€'   }
    };

    function selectCurrency(code) {
        selectedCurrency = code;
        applyCurrencyUI(code);
        updateEarningsDisplay();
        if (currentUser && FIREBASE_READY) saveCloudData();
    }

    function applyCurrencyUI(code) {
        ['BRL','USD','EUR'].forEach(c => {
            const btn = document.getElementById('curr' + c);
            if (btn) {
                btn.classList.toggle('active', c === code);
                btn.setAttribute('aria-pressed', c === code ? 'true' : 'false');
            }
        });
        const sym = CURRENCY_CONFIG[code]?.symbol || 'R$';
        const lbl = document.getElementById('currencySymbolLabel');
        if (lbl) lbl.textContent = sym;
    }

    async function saveHourlyRate() {
        hourlyRate = parseFloat(hourlyRateInput.value) || 0;
        updateEarningsDisplay();
        if (currentUser && FIREBASE_READY) {
            await saveCloudData();
        }
    }

    function updateEarningsDisplay() {
        const rate        = parseFloat(hourlyRateInput.value) || 0;
        const todayData   = getTodayData();
        const todaySecs   = todayData.totalTime || 0;
        const todayEarned = (todaySecs / 3600) * rate;

        let weekSecs = 0;
        for (let i = 0; i < 7; i++) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const ds = getDateString(d);
            if (historyData[ds]) weekSecs += historyData[ds].totalTime || 0;
        }
        const weekEarned = (weekSecs / 3600) * rate;

        document.getElementById('earningsTodayDisplay').textContent = formatCurrency(todayEarned);
        document.getElementById('earningsWeekDisplay').textContent  = formatCurrency(weekEarned);
        document.getElementById('totalHoursDisplay').textContent    = formatTotalTime(todaySecs);
    }

    function formatCurrency(v) {
        const cfg = CURRENCY_CONFIG[selectedCurrency] || CURRENCY_CONFIG.BRL;
        try {
            return new Intl.NumberFormat(cfg.locale, {
                style: 'currency', currency: cfg.code,
                minimumFractionDigits: 2, maximumFractionDigits: 2
            }).format(v);
        } catch {
            return cfg.symbol + ' ' + v.toFixed(2);
        }
    }

    // ════════════════════════════════════════════════════════════════
    // TOAST
    // ════════════════════════════════════════════════════════════════
    let toastTimer;
    function showToast(msg, type = 'info') {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className   = type;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
    }

    // ════════════════════════════════════════════════════════════════
    // TIMER
    // ════════════════════════════════════════════════════════════════
    function getDateString(d) {
        const y  = d.getFullYear();
        const mo = String(d.getMonth() + 1).padStart(2, '0');
        const da = String(d.getDate()).padStart(2, '0');
        return `${y}-${mo}-${da}`;
    }

    function getTodayString() { return getDateString(new Date()); }

    function getTodayData() {
        const today = getTodayString();
        if (!historyData[today]) historyData[today] = { tasks: 0, totalTime: 0 };
        return historyData[today];
    }

    function startTimer() {
        const mins    = parseInt(inputMinutes.value) || 10;
        totalDuration = mins * 60;
        isRunning     = true;
        startTime     = Date.now() - (timeElapsed * 1000);

        btnStart.classList.remove('bg-green-700', 'hover:bg-green-600');
        btnStart.classList.add('bg-yellow-600', 'hover:bg-yellow-500');
        iconContainer.innerHTML = ICON_PAUSE;
        btnStartText.textContent = "Pausar";
        statusText.innerHTML     = `Meta: <span class="font-bold">${formatTime(totalDuration)}</span>`;
        statusText.className     = "text-blue-700 dark:text-blue-400 text-sm font-medium mb-6";

        intervalId = setInterval(updateTimerFromTimestamp, 100);
    }

    function updateTimerFromTimestamp() {
        if (!isRunning) return;
        timeElapsed = Math.floor((Date.now() - startTime) / 1000);
        updateTimerDisplay();
        if (timeElapsed >= totalDuration) finishTask();
    }

    function pauseTimer() {
        isRunning = false;
        clearInterval(intervalId);
        updateTimerDisplay();
        btnStart.classList.remove('bg-yellow-600', 'hover:bg-yellow-500');
        btnStart.classList.add('bg-green-700', 'hover:bg-green-600');
        iconContainer.innerHTML  = ICON_PLAY;
        btnStartText.textContent = "Continuar";
    }

    function resetTimer() {
        pauseTimer();
        timeElapsed   = 0;
        startTime     = null;
        const mins    = parseInt(inputMinutes.value) || 10;
        totalDuration = mins * 60;
        updateTimerDisplay();
        updateTargetDisplay();
        iconContainer.innerHTML  = ICON_PLAY;
        btnStartText.textContent = "Iniciar";
        statusText.innerHTML     = `Meta: <span>${formatTime(totalDuration)}</span>`;
        statusText.className     = "text-slate-600 dark:text-slate-400 text-sm font-medium mb-6";
        progressBar.style.width  = '0%';
        progressContainer.setAttribute('aria-valuenow', '0');
        document.title = defaultTitle;
    }

    function saveData() {
        // Always save device prefs + local history backup
        const data = {
            history:    historyData,
            prefMinutes: inputMinutes.value,
            theme:      htmlElement.classList.contains('dark') ? 'dark' : 'light'
        };
        localStorage.setItem('rws_tracker_data', JSON.stringify(data));

        // Cloud save if logged in
        if (currentUser && FIREBASE_READY) saveCloudData();

        updateChart();
        if (currentUser) updateEarningsDisplay();
    }

    function loadLocalData() {
        const raw = localStorage.getItem('rws_tracker_data');
        if (raw) {
            const data = JSON.parse(raw);
            // Migrate old format
            if (data.tasks !== undefined || data.totalTime !== undefined) {
                const today = getTodayString();
                historyData[today] = { tasks: data.tasks || 0, totalTime: data.totalTime || 0 };
            }
            if (data.history)    historyData = data.history;
            if (data.prefMinutes) inputMinutes.value = data.prefMinutes;
            if (data.theme === 'light') htmlElement.classList.remove('dark');
            else htmlElement.classList.add('dark');
        }
        const mins = parseInt(inputMinutes.value) || 10;
        totalDuration = mins * 60;
        updateStats();
        initChart();
    }

    function clearAllData() {
        if (!confirm("Tem certeza? Isso vai zerar TODO o seu histórico de tarefas e tempo acumulado.")) return;
        historyData = {};
        saveData();
        updateStats();
        if (currentUser) updateEarningsDisplay();
        resetTimer();
        showToast('Histórico apagado', 'info');
    }

    function toggleTheme() {
        htmlElement.classList.toggle('dark');
        // Fix user name color on theme toggle
        if (currentUser) {
            document.getElementById('userNameDisplay').style.color =
                htmlElement.classList.contains('dark') ? '#e2e8f0' : '#334155';
        }
        saveData();
    }

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }

    function formatTotalTime(seconds) {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        if (h > 0) return `${h}h ${m}m`;
        return `${m}m`;
    }

    function updateTargetDisplay() {
        const mins = parseInt(inputMinutes.value) || 10;
        totalDuration = mins * 60;
        targetDisplay.textContent = formatTime(totalDuration);
    }

    function updateTimerDisplay() {
        const formatted = formatTime(timeElapsed);
        timerDisplay.textContent = formatted;
        if (isRunning)          document.title = `${formatted} - Foco`;
        else if (timeElapsed>0) document.title = `Pausado (${formatted})`;
        else                    document.title = defaultTitle;

        let pct = (timeElapsed / totalDuration) * 100;
        if (pct > 100) pct = 100;
        progressBar.style.width = `${pct}%`;
        progressContainer.setAttribute('aria-valuenow', Math.round(pct));
    }

    function toggleTimer() {
        if (isRunning) pauseTimer(); else startTimer();
    }

    function finishTask() {
        playAlarm();
        pauseTimer();
        const todayData = getTodayData();
        todayData.tasks++;
        const mins = parseInt(inputMinutes.value) || 10;
        todayData.totalTime += (mins * 60);
        updateStats();
        saveData();
        statusText.textContent = "Tarefa Concluída!";
        statusText.className   = "text-green-700 dark:text-green-400 text-sm font-bold mb-6";
        document.title = "Concluído! ✅";
        setTimeout(() => { resetTimer(); }, 3000);
    }

    function manualAdjustTask(amount) {
        const todayData = getTodayData();
        const mins = parseInt(inputMinutes.value) || 10;
        if (amount > 0) {
            todayData.tasks++;
            todayData.totalTime += (mins * 60);
        } else {
            if (todayData.tasks > 0) {
                todayData.tasks--;
                todayData.totalTime -= (mins * 60);
                if (todayData.totalTime < 0) todayData.totalTime = 0;
            }
        }
        updateStats();
        saveData();
    }

    function updateStats() {
        const d = getTodayData();
        taskCountDisplay.textContent = d.tasks;
        totalTimeDisplay.textContent = formatTotalTime(d.totalTime);
    }

    function adjustTimeInput(val) {
        let v = parseInt(inputMinutes.value) || 10;
        v += val;
        if (v < 1) v = 1;
        inputMinutes.value = v;
        saveData();
        updateTargetDisplay();
        if (!isRunning) resetTimer();
    }

    function playAlarm() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ctx      = new AC();
        const now      = ctx.currentTime;
        const gain     = ctx.createGain();
        gain.connect(ctx.destination);
        gain.gain.setValueAtTime(0.3, now);
        const note = (f, t, d) => {
            const o = ctx.createOscillator();
            o.type = 'triangle';
            o.frequency.setValueAtTime(f, t);
            o.connect(gain);
            o.start(t); o.stop(t + d);
        };
        const n = [523.25, 659.25, 783.99, 1046.50], s = 0.15;
        note(n[0], now,         s);
        note(n[1], now+s,       s);
        note(n[2], now+s*2,     s);
        note(n[3], now+s*3,     s*3);
        const p2 = now + 0.8;
        note(n[0], p2,          s);
        note(n[1], p2+s,        s);
        note(n[2], p2+s*2,      s);
        note(n[3], p2+s*3,      1.5);
        gain.gain.setValueAtTime(0.3, p2+0.5);
        gain.gain.exponentialRampToValueAtTime(0.0001, p2+2.0);
    }

    // ════════════════════════════════════════════════════════════════
    // CHART
    // ════════════════════════════════════════════════════════════════
    function initChart() {
        const canvas = document.getElementById('productivityChart');
        if (!canvas) return;
        if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
        const ctx      = canvas.getContext('2d');
        const isDark   = htmlElement.classList.contains('dark');
        const txtColor = isDark ? '#94a3b8' : '#64748b';
        const gridClr  = isDark ? 'rgba(51,65,85,0.5)' : 'rgba(226,232,240,0.8)';

        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: getChartData(),
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: { callbacks: { label: c => formatTotalTime(c.raw * 60) + " focados" } }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: { color: txtColor },
                        grid:  { color: gridClr },
                        title: { display: true, text: 'Minutos', color: txtColor, font: { size: 10 } }
                    },
                    x: { ticks: { color: txtColor }, grid: { display: false } }
                }
            }
        });

        const obs = new MutationObserver(() => {
            if (!chartInstance) return;
            const dk  = htmlElement.classList.contains('dark');
            const tc  = dk ? '#94a3b8' : '#64748b';
            const gc  = dk ? 'rgba(51,65,85,0.5)' : 'rgba(226,232,240,0.8)';
            chartInstance.options.scales.x.ticks.color         = tc;
            chartInstance.options.scales.y.ticks.color         = tc;
            chartInstance.options.scales.y.grid.color          = gc;
            chartInstance.options.scales.y.title.color         = tc;
            chartInstance.update();
        });
        obs.observe(htmlElement, { attributes: true });
    }

    function updateChart() {
        if (chartInstance) { chartInstance.data = getChartData(); chartInstance.update(); }
    }

    function getChartData() {
        const labels = [], data = [];
        for (let i = 6; i >= 0; i--) {
            const d  = new Date();
            d.setDate(d.getDate() - i);
            const ds = getDateString(d);
            const mo = String(d.getMonth() + 1).padStart(2, '0');
            const da = String(d.getDate()).padStart(2, '0');
            labels.push(`${da}/${mo}`);
            data.push(historyData[ds] ? Math.round(historyData[ds].totalTime / 60) : 0);
        }
        return {
            labels,
            datasets: [{
                label: 'Minutos Focados',
                data,
                backgroundColor:      'rgba(59,130,246,0.8)',
                hoverBackgroundColor: 'rgba(37,99,235,1)',
                borderRadius: 4
            }]
        };
    }

    // ── Start ─────────────────────────────────────────────────────
    init();
    </script>
